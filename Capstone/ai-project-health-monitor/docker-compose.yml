services:
  postgres:
    image: postgres:17
    container_name: ai-project-health-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_project_health_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ai_project_health_monitor_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  ai_project_health_monitor_postgres_data: